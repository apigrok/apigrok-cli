[package]
name = "apigrok"
version = "0.1.0"
authors = ["API Grokkers <team@apigrok.io>"]
edition = "2024"
description = "A powerful API debugging CLI"
license = "Apache-2.0"

repository = "https://github.com/apigrok/apigrok-cli"
homepage = "https://apigrok.io"
readme = "README.md"

keywords = ["api", "cli", "debugging"]
categories = ["command-line-utilities"]
exclude = [".github", ".gitignore", ".vscode"]

[[bin]]
name = "apigrok"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"

rustls = "0.23"
rustls-native-certs = "0.8"
webpki = "0.22"

tokio = { version = "1.45", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-rustls = "0.26"

hyper = { version = "1.6", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }

h2 = "0.4"
url = "2.5"
http-body = "1.0"
http-body-util = "0.1"
encoding_rs = "0.8"
mime = "0.3"
base64 = "0.22"
clap = { version = "4.5.38", features = ["derive"] }
clap_complete = "4.5"
serde = { version = "1.0", features = ["derive"] }
ansi_term = "0.12"

[dev-dependencies]
