[package]
name = "apigrok"
version = "0.1.0"
edition = "2021"

[features]
test-servers = []

[build-dependencies]
tonic-build = "0.12"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.41", features = ["full"] }
hyper = { version = "1.5", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
hyper-tls = "0.6"
hyper-rustls = { version = "0.27", features = ["http2", "native-tokio"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
h2 = "0.4"
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
tonic = "0.12"
tonic-reflection = "0.12"
prost = "0.13"
prost-types = "0.13"
prost-reflect = "0.14"
protox = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"
url = "2.5"
bytes = "1.8"
futures = "0.3"
futures-util = "0.3"
async-trait = "0.1"
base64 = "0.22"
tokio-stream = "0.1"
tower = "0.4"

[[bin]]
name = "apigrok"
path = "src/main.rs"

[[bin]]
name = "http_test_server"
path = "tests/servers/http_server.rs"
required-features = ["test-servers"]

[[bin]]
name = "ws_test_server"
path = "tests/servers/ws_server.rs"
required-features = ["test-servers"]

[[bin]]
name = "grpc_test_server"
path = "tests/servers/grpc_server.rs"
required-features = ["test-servers"]
